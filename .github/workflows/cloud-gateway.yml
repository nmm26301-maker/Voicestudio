name: VoiceStudio cloud gateway checks
on:
  push:
    branches: [main, feature/cloud-voice-20261014]
  pull_request:
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r server/cloud_requirements.txt
      - name: Compile Python and test without provider keys
        run: |
          python -m compileall -q server/cloud_gateway.py server/gptsovits_bridge.py server/test_cloud_gateway.py server/test_eight_engines.py
          python -m pytest -q server/test_cloud_gateway.py server/test_open_model_worker.py server/test_eight_engines.py
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android build dependencies
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --retry 3 --output /tmp/ecj.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar
      - name: Compile unsigned Android APK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ECJ_JAR=/tmp/ecj.jar
          VOICE_UNSIGNED=1 bash tools/build.sh
          unzip -l build-manual/VoiceStudio-1.5.24-Cloud-unsigned.apk | grep -E 'classes.dex|AndroidManifest.xml'
          if unzip -Z1 build-manual/VoiceStudio-1.5.24-Cloud-unsigned.apk | grep -q 'libonnxruntime'; then
            echo "Unexpected local ONNX runtime in cloud-only APK" >&2; exit 1
          fi
      - name: Run Java remote speech regressions
        run: |
          curl --fail --location --retry 3 --output /tmp/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          ECJ_JAR=/tmp/ecj.jar JSON_JAR=/tmp/json.jar bash tests/run_accelerated.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-1.5.24-cloud-unsigned-compile-check
          path: build-manual/VoiceStudio-1.5.24-Cloud-unsigned.apk
          if-no-files-found: error
          retention-days: 7
