name: Deploy VoiceStudio Qwen3-TTS to Modal
# This entrypoint is visible in GitHub Actions on the default branch.
# It deploys the draft cloud feature branch only after a user's manual click.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-qwen:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout tested cloud feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloud-voice-20261014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Modal credentials are configured
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Configure MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as GitHub Actions repository secrets first."
            exit 1
          fi
      - name: Install deploy client
        run: python -m pip install "modal>=1.1,<2"
      - name: Validate Python syntax
        run: python -m compileall -q server/modal_qwen_deploy.py server/cloud_gateway.py server/open_model_worker.py
      - name: Publish remote L4 GPU app (manual only)
        run: modal deploy -m server.modal_qwen_deploy
