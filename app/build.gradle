plugins { id 'com.android.application' }
android {
    namespace 'com.voice.studio'
    compileSdk 35
    defaultConfig { applicationId 'com.voice.studio'; minSdk 26; targetSdk 34; versionCode 32; versionName '1.5.16-hybrid' }
    splits { abi { enable true; reset(); include 'arm64-v8a'; universalApk false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation files('libs/onnxruntime-android-1.30.0.aar') }
