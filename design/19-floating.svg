蓝牙耳机可在录音选项中选择。" x="18" y="70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#74788E" text-anchor="start"><tspan x="18" dy="0">在工作台启动；麦克风录音需要授权。</tspan><tspan x="18" dy="19.5">蓝牙耳机可在录音选项中选择。</tspan></text></g><g id="悬浮小窗示例" transform="translate(20,377)"><rect width="350" height="274" rx="22" fill="#FFFFFF"/><text id="VoiceStudio · 听写" x="18" y="35" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#202239" text-anchor="start"><tspan x="18" dy="0">VoiceStudio · 听写</tspan></text><g id="点击开始 / 停止录音"><rect x="18" y="62" width="314" height="48" rx="15" fill="#6154DB"/><text x="175.0" y="92" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">点击开始 / 停止录音</text></g><text id="今天想记录一个新的想法。" x="18" y="151" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#202239" text-anchor="start"><tspan x="18" dy="0">今天想记录一个新的想法。</tspan></text><text id="识别结果可校对，再自行粘贴。" x="18" y="192" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#74788E" text-anchor="start"><tspan x="18" dy="0">识别结果可校对，再自行粘贴。</tspan></text><g id="复制文字"><rect x="18" y="211" width="153" height="48" rx="15" fill="#EEEBFF"/><text x="94.5" y="241" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#6154DB">复制文字</text></g><g id="再录一次"><rect x="179" y="211" width="153" height="48" rx="15" fill="#EEEBFF"/><text x="255.5" y="241" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#6154DB">再录一次</text></g></g><text id="录音启动说明" x="20" y="693" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="12" font-weight="400" fill="#74788E" text-anchor="start"><tspan x="20" dy="0">打开录音小窗后启动麦克风，再自动返回。</tspan></text><g id="启动悬浮听写"><rect x="2