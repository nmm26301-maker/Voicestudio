services:
  gateway:
    build:
      context: ..
      dockerfile: server/Cloud.Dockerfile
    env_file: .env.cloud
    volumes:
      - references:/references
    restart: unless-stopped
  https:
    image: caddy:2
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in server/.env.cloud}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped
volumes:
  references:
  caddy_data:
  caddy_config:
